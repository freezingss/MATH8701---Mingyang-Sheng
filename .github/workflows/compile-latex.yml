name: Compile LaTeX to PDF

on:
  push:
    paths:
      - 'Research Log/**'  
  workflow_dispatch:       

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MATH8701
        uses: actions/checkout@v3

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: "Research Log"

      - name: Move PDF to Research Log folder
        run: echo "PDF already in Research Log folder"

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "Research Log/main.pdf"
          git diff --staged --quiet || git commit -m "Auto-compile PDF from LaTeX"
          git push
